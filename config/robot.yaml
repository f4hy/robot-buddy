# Pins use BCM GPIO numbers. See docs/DESIGN.md for the wiring table.
robot:
  name: robot                # hostname; the home router's DNS resolves it
  port: 80                   # phone opens http://robot (M3); ROBOT_PORT overrides
  buddy_name: updog          # what the robot calls itself; Rowan picks it
  kid_name: Rowan            # who it greets at startup

motors:
  left:  {forward: 17, backward: 27, enable: 24, invert: false}
  right: {forward: 22, backward: 23, enable: 25, invert: false}
  standby: 5                 # TB6612 STBY; low = driver off
  max_speed: 1.0             # 4xAA is about 6 V, fine for TT motors
  kid_mode_speed: 0.6        # cap while kid mode is on (default at boot)
  watchdog_ms: 500           # stop if no drive command for this long

audio:
  device: plughw:CARD=sndrpihifiberry,DEV=0   # I2S amp via the hifiberry-dac overlay (M2)
  volume: 0.1                # 0-1; the 3 W speaker is loud and draws on the power bank
